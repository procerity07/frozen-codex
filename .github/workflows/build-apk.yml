name: Build Frozen Codex Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two quick pushes can't claim the same version number.
concurrency:
  group: frozen-codex-release
  cancel-in-progress: false

jobs:
  build-apk:
    name: Verify & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Free runner disk space for NDK & New Architecture C++ build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, so release notes can list every change since the last release.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17 and JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & SQLite seed verification
        run: npm run verify

      - name: Compute next version from the latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          ver="${latest#[vV]}"
          IFS=. read -r major minor patch <<< "$ver"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            major=1; minor=0; patch=0
          fi
          next="$major.$minor.$((patch + 1))"
          code=$((major * 10000 + minor * 100 + patch + 1))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${latest:-none} -> building v$next (versionCode $code)"

      - name: Stamp version into app.json
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.version=process.env.APP_VERSION;a.expo.android.versionCode=Number(process.env.APP_VERSION_CODE);fs.writeFileSync('app.json',JSON.stringify(a,null,2)+'\n');console.log('app.json ->',a.expo.version,a.expo.android.versionCode)"

      - name: Generate native Android project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --clean --no-install
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          printf '\norg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64\n' >> android/gradle.properties

      - name: Assemble signed Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK artifact
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Frozen-Codex-v${APP_VERSION}.apk"
          ls -lh "Frozen-Codex-v${APP_VERSION}.apk"

      - name: Upload Frozen Codex APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frozen-Codex-v${{ steps.version.outputs.version }}-APK
          path: Frozen-Codex-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous }}
        run: |
          python3 scripts/release-notes.py "$PREVIOUS_TAG" "$APP_VERSION" "${{ github.sha }}" > release-notes.txt
          cat release-notes.txt
          gh release create "v${APP_VERSION}" "Frozen-Codex-v${APP_VERSION}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Frozen Codex v${APP_VERSION}" \
            --notes-file release-notes.txt \
            --latest
