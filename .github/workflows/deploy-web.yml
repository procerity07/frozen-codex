name: Deploy Frozen Codex web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frozen-codex-web
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build web version and publish to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export web build
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
          WEB_BASE_URL: /frozen-codex
        run: npx expo export --platform web --output-dir web-dist && node scripts/web-postbuild.js web-dist
      - name: Publish to the gh-pages branch
        run: |
          cp web-dist/index.html web-dist/404.html
          touch web-dist/.nojekyll
          cd web-dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
