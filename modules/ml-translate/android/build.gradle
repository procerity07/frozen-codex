plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.frozencodex'
version = '1.0.0'

android {
  namespace "expo.modules.mltranslate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "com.google.mlkit:translate:17.0.3"
}
